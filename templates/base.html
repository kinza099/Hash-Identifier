<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Hash Identifier{% endblock %} | by Kinza</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar">
    <div class="nav-left">
        <span class="logo">🔐 Hash<span class="accent">ID</span></span>
    </div>
    <div class="nav-right">
        <a href="{{ url_for('index') }}" class="nav-link">Tool</a>
        <a href="{{ url_for('author') }}" class="nav-link">Author</a>
        <button id="theme-toggle" class="theme-toggle" title="Toggle dark / light mode">
            <span id="theme-icon">🌙</span>
        </button>
    </div>
</nav>

<main class="container">
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <p>Made with ❤️ by <strong>{{ author.name }}</strong> &nbsp;|&nbsp;
        <a href="{{ author.github }}" target="_blank" rel="noopener">GitHub</a> &nbsp;|&nbsp;
        <a href="mailto:{{ author.email }}">{{ author.email }}</a>
    </p>
</footer>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
