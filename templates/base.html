<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Hash Identifier & Analysis Toolkit{% endblock %} | by Kinza</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar">
    <div class="nav-left">
        <a href="{{ url_for('index') }}" style="text-decoration:none; color:inherit;">
            <span class="logo"><span class="material-symbols-outlined logo-icon">lock</span> Hash<span class="accent">ID</span></span>
        </a>
        <span class="logo-badge">Analysis Toolkit</span>
    </div>
    <div class="nav-right">
        <a href="{{ url_for('index') }}" class="nav-link">Toolkit</a>
        <a href="{{ url_for('author') }}" class="nav-link">Author</a>
        <button id="theme-toggle" class="theme-toggle" title="Toggle dark / light mode">
            <span id="theme-icon" class="material-symbols-outlined">dark_mode</span>
        </button>
    </div>
</nav>

{% block nav_tabs %}{% endblock %}

<main class="container">
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <p>Developed with <span class="material-symbols-outlined heart-icon">favorite</span> by <strong>Kinza &amp; Salman Mallah</strong> &nbsp;|&nbsp;
        <a href="https://github.com/kinza099" target="_blank" rel="noopener">GitHub (Kinza)</a> &nbsp;|&nbsp;
        <a href="https://github.com/salmanmallah" target="_blank" rel="noopener">GitHub (Salman)</a> &nbsp;|&nbsp;
        <a href="{{ url_for('author') }}">Authors &amp; Credits</a>
    </p>
</footer>

<script src="{{ url_for('static', filename='js/crypto_engine.js') }}"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
